<style>
  .rpt { max-width: 1100px; margin: 0 auto; padding: 4px 0 40px; font-size: 14px; line-height: 1.5; }
  .rpt h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
  .rpt h2 { font-size: 15px; font-weight: 600; margin: 32px 0 10px; }
  .rpt .sub { opacity: .65; margin: 0 0 18px; }
  .rpt .muted { opacity: .6; }
  .rpt .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* filters */
  .rpt .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 22px; }
  .rpt .filters input, .rpt .filters select {
    height: 38px; padding: 0 12px; border-radius: 8px; font: inherit;
    border: 1px solid rgba(128,128,128,.35); background: transparent; color: inherit;
  }
  .rpt .btn {
    height: 38px; padding: 0 16px; border-radius: 8px; border: 0; cursor: pointer;
    font: inherit; font-weight: 600; background: #4f46e5; color: #fff;
    display: inline-flex; align-items: center; text-decoration: none;
  }
  .rpt .btn:hover { background: #4338ca; }
  .rpt .btn.ghost { background: transparent; color: inherit; border: 1px solid rgba(128,128,128,.35); font-weight: 500; }
  .rpt .btn.ghost:hover { background: rgba(128,128,128,.1); }

  /* totals strip */
  .rpt .kpis { display: flex; flex-wrap: wrap; border: 1px solid rgba(128,128,128,.25); border-radius: 10px; overflow: hidden; }
  .rpt .kpi { flex: 1 1 180px; padding: 14px 18px; border-right: 1px solid rgba(128,128,128,.25); }
  .rpt .kpi:last-child { border-right: 0; }
  .rpt .kpi .label { font-size: 12px; opacity: .65; }
  .rpt .kpi .value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* status chips */
  .rpt .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .rpt .chip { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: rgba(128,128,128,.14); }
  .rpt .chip.delivered { background: rgba(22,163,74,.16); color: #16a34a; }
  .rpt .chip.pending { background: rgba(217,119,6,.16); color: #d97706; }
  .rpt .chip.cancelled { background: rgba(220,38,38,.16); color: #dc2626; }

  /* tables */
  .rpt .tablewrap { overflow-x: auto; border: 1px solid rgba(128,128,128,.25); border-radius: 10px; }
  .rpt table { width: 100%; border-collapse: collapse; }
  .rpt th, .rpt td { padding: 9px 14px; text-align: left; border-bottom: 1px solid rgba(128,128,128,.18); }
  .rpt th { font-size: 12px; font-weight: 600; opacity: .75; background: rgba(128,128,128,.08); white-space: nowrap; }
  .rpt th.num { text-align: right; }
  .rpt tbody tr:last-child td { border-bottom: 0; }
  .rpt tbody tr:hover td { background: rgba(128,128,128,.06); }
  .rpt tfoot td { font-weight: 700; background: rgba(128,128,128,.08); border-bottom: 0; }
  .rpt .low { color: #dc2626; font-weight: 600; }
  .rpt .empty { padding: 18px; opacity: .6; }

  .rpt .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  @media (max-width: 800px) { .rpt .grid2 { grid-template-columns: 1fr; } }
  .rpt a { color: #4f46e5; text-decoration: none; }
  .rpt a:hover { text-decoration: underline; }
  .rpt .btn, .rpt .btn:hover { text-decoration: none; }
  .rpt .btn:not(.ghost) { color: #fff; }
  .rpt .chartcard h2 { margin-top: 0; }
  .rpt .chartbox { position: relative; height: 280px; border: 1px solid rgba(128,128,128,.25); border-radius: 10px; padding: 14px; }
  .rpt .chartbox .empty { padding: 0; }
  .rpt .chartrow { margin-top: 28px; }
  .rpt .chartrow + .chartrow { margin-top: 20px; }
</style>
